name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FinTrack_CI_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FinTrack_CI_Only_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      FINTRACK_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=FinTrack_CI_Only_2026!;Encrypt=False;TrustServerCertificate=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinTrack.slnx -m:1

      - name: Build
        run: dotnet build FinTrack.slnx --no-restore -m:1

      - name: Test
        run: dotnet test FinTrack.slnx --no-build -m:1 --settings tests/FinTrack.Tests/coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory out/coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: out/coverage
          if-no-files-found: error

      - name: Validate retention command guards
        shell: pwsh
        run: ./scripts/validation/check-audit-retention.ps1

      - name: Setup Node for browser validation
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FinTrack.Web/package-lock.json

      - name: Build frontend and install browser
        working-directory: src/FinTrack.Web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Validate browser flow and mobile layouts
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5081
          ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=FinTrackValidation_CI;User Id=sa;Password=FinTrack_CI_Only_2026!;Encrypt=False;TrustServerCertificate=True
          FINTRACK_API_URL: http://127.0.0.1:5081
        run: |
          mkdir -p out/validation
          dotnet src/FinTrack.Api/bin/Debug/net10.0/FinTrack.Api.dll --contentRoot "$GITHUB_WORKSPACE/src/FinTrack.Api" > out/validation/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e '
            for (let attempt = 0; attempt < 60; attempt++) {
              try { if ((await fetch(process.env.FINTRACK_API_URL + "/health")).ok) process.exit(0); } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            throw new Error("API did not become healthy");'
          node scripts/validation/check-ui.mjs

      - name: Upload browser validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: out/validation
          if-no-files-found: ignore

      - name: Rebuild and validate Docker images
        env:
          FINTRACK_API_URL: http://127.0.0.1:5080
          FINTRACK_WEB_URL: http://localhost:4200
        run: |
          docker build -t fintrack-api:validation -f src/FinTrack.Api/Dockerfile .
          docker build -t fintrack-web:validation src/FinTrack.Web
          cleanup() {
            docker logs fintrack-api-validation > out/validation/docker-api.log 2>&1 || true
            docker logs fintrack-web-validation > out/validation/docker-web.log 2>&1 || true
            docker rm -f fintrack-api-validation fintrack-web-validation || true
          }
          trap cleanup EXIT
          docker run -d --name fintrack-api-validation --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e "ConnectionStrings__DefaultConnection=${FINTRACK_TEST_SQLSERVER};Database=FinTrackDockerValidation_CI" \
            fintrack-api:validation
          docker run -d --name fintrack-web-validation --network host \
            fintrack-web:validation
          node --input-type=module -e '
            for (let attempt = 0; attempt < 90; attempt++) {
              try {
                if ((await fetch(process.env.FINTRACK_API_URL + "/health")).ok &&
                    (await fetch(process.env.FINTRACK_WEB_URL)).ok) process.exit(0);
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            throw new Error("Docker services did not become healthy");'
          node scripts/validation/check-ui.mjs

      - name: Upload Docker validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-validation
          path: out/validation
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FinTrack.Web/package-lock.json

      - name: Install
        working-directory: src/FinTrack.Web
        run: npm ci

      - name: Build
        working-directory: src/FinTrack.Web
        run: npm run build

      - name: Install test browser
        working-directory: src/FinTrack.Web
        run: npx playwright install chromium

      - name: Test
        working-directory: src/FinTrack.Web
        env:
          # Usar o Chromium instalado pelo Playwright, sem sobrescrita do runner.
          CHROME_BIN: ''
        run: npm test -- --watch=false --browsers=ChromiumHeadless
