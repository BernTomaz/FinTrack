name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FinTrack_CI_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FinTrack_CI_Only_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      FINTRACK_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=FinTrack_CI_Only_2026!;Encrypt=False;TrustServerCertificate=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinTrack.slnx -m:1

      - name: Build
        run: dotnet build FinTrack.slnx --no-restore -m:1

      - name: Test
        run: dotnet test FinTrack.slnx --no-build -m:1

  frontend:
    name: Frontend
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FinTrack.Web/package-lock.json

      - name: Install
        working-directory: src/FinTrack.Web
        run: npm ci

      - name: Build
        working-directory: src/FinTrack.Web
        run: npm run build

      - name: Test
        working-directory: src/FinTrack.Web
        run: npm test -- --watch=false --browsers=ChromeHeadless
